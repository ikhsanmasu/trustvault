name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run test

      - name: Security audit (npm audit)
        run: npm audit --audit-level=high --production
        continue-on-error: false

      - name: Check for committed secrets
        run: |
          echo "Scanning for secrets in committed files..."
          # Check for common secret patterns
          ! git grep -nE "sk-[a-zA-Z0-9]{20,}" -- "*.ts" "*.tsx" || { echo "ERROR: Possible API key in source"; exit 1; }
          ! git grep -nE "eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*" -- "*.ts" "*.tsx" || { echo "ERROR: Possible JWT in source"; exit 1; }
          ! git grep -nE "0x[0-9a-fA-F]{64}" -- "*.ts" "*.tsx" || { echo "ERROR: Possible private key in source"; exit 1; }
          echo "No committed secrets found"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compile Solidity contract (TrustVaultAnchor.sol)
        run: forge build

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Supabase migration files are present
        run: |
          MIGRATION_DIR="supabase/migrations"
          if [ ! -d "$MIGRATION_DIR" ]; then
            echo "ERROR: supabase/migrations directory not found"
            exit 1
          fi

          MIGRATION_COUNT=$(find "$MIGRATION_DIR" -maxdepth 1 -name "*.sql" -type f | wc -l)
          if [ "$MIGRATION_COUNT" -eq 0 ]; then
            echo "ERROR: No migration files found in $MIGRATION_DIR"
            exit 1
          fi
          echo "Found $MIGRATION_COUNT migration file(s)"

      - name: Validate migration naming convention
        run: |
          MIGRATION_DIR="supabase/migrations"
          INVALID=$(find "$MIGRATION_DIR" -maxdepth 1 -name "*.sql" -type f | while read f; do
            basename=$(basename "$f")
            # Must match: YYYYMMDDHHMMSS_descriptive_name.sql
            if ! echo "$basename" | grep -qE '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "  INVALID: $basename"
            fi
          done)

          if [ -n "$INVALID" ]; then
            echo "ERROR: Migration files with invalid naming convention found:"
            echo "$INVALID"
            echo "Expected format: YYYYMMDDHHMMSS_descriptive_name.sql"
            exit 1
          fi
          echo "All migration file names are valid"

      - name: List migrations (informational)
        run: |
          echo "Migration files (applied in order):"
          find supabase/migrations -maxdepth 1 -name "*.sql" -type f | sort | while read f; do
            echo "  $f"
          done
